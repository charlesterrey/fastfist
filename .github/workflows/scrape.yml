name: Mise à jour des prix BK

on:
  schedule:
    - cron: "17 4 * * *"   # tous les jours vers 5-6h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scraper le menu de tous les restos
        run: python3 scraper/scrape.py --workers 12
      - name: Commit des nouvelles données
        run: |
          git config user.name "fastfist-bot"
          git config user.email "fastfist-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Aucun changement de prix."
          else
            git commit -m "data: prix BK du $(date -u +%Y-%m-%d)"
            git push
          fi
