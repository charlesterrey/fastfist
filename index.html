<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FastFist — Gratte les fast-foods</title>
  <meta name="description" content="Le comparateur qui calcule le coût réel de chaque élément de menu Burger King et Quick, resto par resto, pour manger un max pour pas cher.">
  <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="FastFist — Gratte les fast-foods">
  <meta property="og:description" content="Coût unitaire de chaque élément de menu, €/1000 kcal, optimiseur de budget, duel entre chaînes. Burger King & Quick, tous les restos de France.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // thème avant le premier rendu (évite le flash)
    try { const t = localStorage.getItem("ff-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Aller au contenu</a>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/plans" aria-label="FastFist, accueil">
        <span class="brand-mark" aria-hidden="true">✊</span>
        <span class="brand-name">FastFist</span>
      </a>

      <button class="resto-chip" id="resto-chip" type="button" aria-haspopup="dialog" aria-controls="picker">
        <span class="resto-chip-chain" id="chip-chain">…</span>
        <span class="resto-chip-main">
          <span class="resto-chip-name" id="chip-name">Chargement…</span>
          <span class="resto-chip-sub" id="chip-sub"></span>
        </span>
        <span class="resto-chip-caret" aria-hidden="true">⌄</span>
      </button>

      <nav class="nav" aria-label="Sections">
        <a href="#/plans" data-route="plans">Bons plans</a>
        <a href="#/menus" data-route="menus">Menus</a>
        <a href="#/carte" data-route="carte">Carte</a>
        <a href="#/budget" data-route="budget">Budget</a>
        <a href="#/duel" data-route="duel">Duel</a>
        <a href="#/france" data-route="france">France</a>
      </nav>

      <div class="top-actions">
        <button class="icon-btn" id="share-btn" type="button" title="Copier le lien de cette page" aria-label="Partager">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" type="button" title="Changer de thème" aria-label="Changer de thème">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="wrap view" tabindex="-1" aria-live="polite">
    <div class="skeleton-page">
      <div class="sk sk-title"></div>
      <div class="sk-grid"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
    </div>
  </main>

  <footer class="wrap footer">
    <div>
      <b>FastFist</b> — calculs faits dans ton navigateur à partir des prix publics de la commande en ligne.
      <span id="updated"></span>
    </div>
    <div class="footer-links">
      <a href="#/methode">Méthode</a>
      <a href="https://github.com/charlesterrey/fastfist">Code source</a>
      <span>Projet indépendant, sans lien avec Burger King® ni Quick®.</span>
    </div>
  </footer>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/plans" data-route="plans"><span>🏆</span>Plans</a>
    <a href="#/menus" data-route="menus"><span>🍟</span>Menus</a>
    <a href="#/budget" data-route="budget"><span>💶</span>Budget</a>
    <a href="#/duel" data-route="duel"><span>⚔️</span>Duel</a>
    <a href="#/plus" data-route="plus"><span>☰</span>Plus</a>
  </nav>

  <!-- sélecteur de resto -->
  <div class="sheet-backdrop" id="picker-backdrop" hidden></div>
  <section class="sheet" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="picker-title">Choisis ton resto</h2>
      <button class="icon-btn" data-close type="button" aria-label="Fermer">✕</button>
    </header>
    <div class="sheet-body">
      <div class="seg seg-full" id="picker-chains" role="tablist" aria-label="Chaîne"></div>
      <div class="search-row">
        <input id="picker-q" type="search" autocomplete="off" placeholder="Ville, code postal, nom du resto…" aria-label="Rechercher un resto">
        <button class="btn btn-soft" id="picker-geo" type="button">📍 Autour de moi</button>
      </div>
      <ul class="picker-list" id="picker-list" role="listbox" aria-label="Restaurants"></ul>
    </div>
  </section>

  <!-- fiche détaillée -->
  <div class="sheet-backdrop" id="detail-backdrop" hidden></div>
  <section class="sheet sheet-wide" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="detail-content"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/engine.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
